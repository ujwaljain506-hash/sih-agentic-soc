services:
  # 1. FastAPI REST Backend
  api:
    build: .
    container_name: soc_api
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - API_KEY=${API_KEY:-}
    restart: unless-stopped

  # 2. Streamlit Dashboard
  dashboard:
    build: .
    container_name: soc_dashboard
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - API_KEY=${API_KEY:-}
    restart: unless-stopped

  # 3. Continuous AI Engine (starts by default so the demo is fully autonomous)
  agent:
    build: .
    container_name: soc_agent
    command: python agent.py
    volumes:
      - .:/app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - API_KEY=${API_KEY:-}
    restart: unless-stopped

  # 4. Attack Simulator (live attack traffic for demos — stop it with:
  #    docker compose stop simulator)
  simulator:
    build: .
    container_name: soc_simulator
    command: python simulate_attacks.py
    volumes:
      - .:/app
    restart: unless-stopped
